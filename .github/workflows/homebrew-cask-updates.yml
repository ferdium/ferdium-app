name: Homebrew cask updates

on:
  release:
    types: [published]
  # Manual trigger from the UI
  workflow_dispatch:
    inputs:
      channel:
        description: 'Cask channel to publish'
        required: true
        type: choice
        options:
          - nightly
          - beta
          - stable

jobs:
  bump-casks:
    runs-on: macos-14

    steps:
      - name: Trust Ferdium Homebrew tap
        run: |
          brew tap ferdium/ferdium
          brew trust ferdium/ferdium

      - name: Publish nightly
        uses: friesi23/action-homebrew-bump-cask@v2
        if: ${{ (github.event_name == 'release' && contains(github.event.release.tag_name, 'nightly')) || (github.event_name == 'workflow_dispatch' && inputs.channel == 'nightly') }}
        with:
          # Required, custom GitHub access token with only the 'public_repo' scope enabled
          token: ${{ secrets.HOMEBREW_FERDIUM_PUBLISH_TOKEN }}
          # Bump all outdated casks in this tap
          tap: ferdium/homebrew-ferdium
          # Bump only these casks if outdated
          cask: ferdium-nightly
          livecheck: true
          dryrun: false

      - name: Publish beta
        uses: friesi23/action-homebrew-bump-cask@v2
        if: ${{ (github.event_name == 'release' && contains(github.event.release.tag_name, 'beta')) || (github.event_name == 'workflow_dispatch' && inputs.channel == 'beta') }}
        with:
          # Required, custom GitHub access token with only the 'public_repo' scope enabled
          token: ${{ secrets.HOMEBREW_FERDIUM_PUBLISH_TOKEN }}
          # Bump all outdated casks in this tap
          tap: ferdium/homebrew-ferdium
          # Bump only these casks if outdated
          cask: ferdium-beta
          livecheck: true
          dryrun: false

      - name: Publish release
        uses: friesi23/action-homebrew-bump-cask@v2
        if: ${{ (github.event_name == 'release' && !contains(github.event.release.tag_name, 'nightly') && !contains(github.event.release.tag_name, 'beta')) || (github.event_name == 'workflow_dispatch' && inputs.channel == 'stable') }}
        with:
          # Required, custom GitHub access token with only the 'public_repo' scope enabled
          token: ${{ secrets.HOMEBREW_FERDIUM_PUBLISH_TOKEN }}
          # Bump all outdated casks in this tap
          tap: ferdium/homebrew-ferdium
          # Bump only these casks if outdated
          cask: ferdium
          livecheck: true
          dryrun: false
